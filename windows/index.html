<script>
'use strict';
if(typeof navigator!=='undefined'&&navigator.standalone)document.documentElement.classList.add('standalone');
(function(root){
  'use strict';
  function parse(value){
    let text=String(value||'').replace(/[\u200B\uFEFF]/g,'').trim();
    if(!/^https?:\/\//i.test(text)&&/^\d+\.\d+\.\d+\.\d+(?::\d+)?\//.test(text))text='http://'+text;
    let url;try{url=new URL(text);}catch{throw Error('二维码中不是有效的网址，请对准电脑上的连接二维码。');}
    if(!['http:','https:'].includes(url.protocol)||url.username||url.password)throw Error('请扫描电脑遥控器页面上的连接二维码。');
    const hostname=url.hostname.toLowerCase().replace(/^\[|\]$/g,'');
    if(hostname==='localhost'||hostname==='127.0.0.1')throw Error('这是电脑本机地址。请扫描电脑页面中以 192.168、10 或 172 开头的手机连接二维码。');
    const parts=hostname.split('.').map(Number);
    const ipv4=parts.length===4&&parts.every(n=>Number.isInteger(n)&&n>=0&&n<=255);
    const local=ipv4&&(parts[0]===10||(parts[0]===192&&parts[1]===168)||(parts[0]===172&&parts[1]>=16&&parts[1]<=31)||(parts[0]===169&&parts[1]===254));
    if(!(local||hostname.endsWith('.local')||/^(?:fd|fc)[a-f0-9:]+$/.test(hostname)))throw Error('二维码指向陌生地址，请扫描电脑上的局域网连接二维码。');
    let fragment;try{fragment=decodeURIComponent(url.hash.slice(1));}catch{fragment=url.hash.slice(1);}
    const params=new URLSearchParams(fragment.replace(/^\?/,''));
    const token=params.get('token')||params.get('key')||url.searchParams.get('token')||url.searchParams.get('key')||fragment;
    if(!/^[A-Za-z0-9_-]{20,128}$/.test(token))throw Error('这个二维码没有配对信息。请扫描电脑连接页面中的二维码，而不是浏览器地址或路由器二维码。');
    url.pathname='/app/7/';url.search='';url.hash=token;
    return url.href;
  }
  root.RemotePairing={parse};
  if(typeof module!=='undefined'&&module.exports)module.exports=root.RemotePairing;
})(typeof window!=='undefined'?window:globalThis);

const $=id=>document.getElementById(id), UI_VERSION='9', APP_PATH='/app/9/';
let token=location.hash.slice(1),timer,toastTimer,artUrl='',coverVersion='',artRequest=0;

let seekDragging=false,seekUntil=0,seekOriginKey='',seekBusy=false,scannerUrl='';
try{scannerUrl=localStorage.getItem('remoteScannerUrl')||'';}catch{}
let cachedArt='',cachedArtVersion='',lastSaved=0,lastSavedTrack='';
try{if(token)localStorage.setItem('remoteToken',token);else token=localStorage.getItem('remoteToken')||sessionStorage.getItem('remoteToken')||'';}catch{}
if(token&&(location.pathname!==APP_PATH||!location.hash))history.replaceState(null,'',APP_PATH+'#'+token);
const headers=()=>({'Authorization':'Bearer '+token,'Content-Type':'application/json'});
const trackKey=s=>[s?.title,s?.artist,s?.album].join('\n');

async function api(path,options={}){
  const response=await fetch(path,{...options,headers:headers(),cache:'no-store',signal:options.signal||AbortSignal.timeout(10000)});
  if(response.status===401)throw Error('连接码已失效，请点击右上角扫码重新连接。');
  if(!response.ok){let message='暂时无法连接，正在重试。请确认电脑已开机并与手机连接同一 Wi-Fi。';try{message=(await response.json()).error||message;}catch{}throw Error(message);}

}
function stamp(seconds){seconds=Math.max(0,Math.floor(seconds||0));return Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');}
function controls(state){for(const id of ['previous','toggle','next'])$(id).disabled=busy||!state?.available||!state?.controls?.[id];$('volume').disabled=state?.volume==null;$('mute').disabled=busy||state?.volume==null;$('seek').disabled=seekBusy||!state?.controls?.seek||!state?.duration;}

  ++artRequest;if(artUrl)URL.revokeObjectURL(artUrl);artUrl='';
  $('art').src=state.cover_data;$('art').hidden=false;coverVersion=state.cover;
  cachedArt=state.cover_data;cachedArtVersion=state.cover;
}
async function artwork(version){
  if(version===coverVersion)return;
  if(!version){clearCover();return;}
  const request=++artRequest;
  try{
    const response=await api('/api/cover?v='+encodeURIComponent(version));
    const blob=await response.blob();
    if(request!==artRequest||lastState?.cover!==version)return;
    const next=URL.createObjectURL(blob);$('art').src=next;$('art').hidden=false;
    if(artUrl)URL.revokeObjectURL(artUrl);artUrl=next;coverVersion=version;
    const reader=new FileReader();reader.onload=()=>{if(coverVersion===version){cachedArt=String(reader.result);cachedArtVersion=version;if(lastState)saveView(lastState,true);}};reader.readAsDataURL(blob);

function saveView(state,force=false){
  const key=trackKey(state)+'|'+state.cover;
  if(!force&&key===lastSavedTrack&&Date.now()-lastSaved<2000)return;
  lastSaved=Date.now();lastSavedTrack=key;
  try{
    const clean={...state};delete clean.cover_data;
    localStorage.setItem('remoteViewV5',JSON.stringify({token,state:clean,cover_data:cachedArtVersion===state.cover?cachedArt:'',savedAt:Date.now()}));
  }catch{}
}
function render(state,restored=false){
if(typeof state.scanner_url==='string'&&state.scanner_url){scannerUrl=state.scanner_url;try{localStorage.setItem('remoteScannerUrl',scannerUrl);}catch{}}
  if(state.ui_version&&state.ui_version!==UI_VERSION&&/^\d+$/.test(state.ui_version)){location.replace('/app/'+state.ui_version+'/#'+token);return;}
  if(pendingTrack){
    if(trackKey(state)!==pendingTrack.key||Date.now()>pendingTrack.until)pendingTrack=null;

async function scanFile(file){
  if(!file)return;
  const message=$('scanMessage');
  message.textContent='正在识别二维码…';
  let objectUrl='';
  try{
    if(file.size>25*1024*1024)throw Error('图片太大，请重新拍摄或选择较小的二维码图片。');
    if(typeof jsQR!=='function')throw Error('扫码组件尚未加载。请恢复连接后再试，或直接使用 iPhone 相机扫描电脑二维码。');
    objectUrl=URL.createObjectURL(file);
    const image=new Image();
    await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=()=>reject(Error('无法读取图片，请用普通照片或截图重试。'));image.src=objectUrl;});
    const canvas=document.createElement('canvas');
    const context=canvas.getContext('2d',{willReadFrequently:true});
    let code=null;
    for(const size of [1600,900]){
      const scale=Math.min(1,size/Math.max(image.naturalWidth,image.naturalHeight));
      canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));
      context.drawImage(image,0,0,canvas.width,canvas.height);
      const pixels=context.getImageData(0,0,canvas.width,canvas.height);
      code=jsQR(pixels.data,pixels.width,pixels.height,{inversionAttempts:'attemptBoth'});
      if(code)break;
    }
    if(!code)throw Error('没有识别到二维码。请靠近一些，拍下完整、清晰的电脑二维码。');
    const address=remoteQR(code.data);
    message.textContent='识别成功，正在连接…';
    location.assign(address);
  }catch(error){message.textContent=error.message;}
  finally{if(objectUrl)URL.revokeObjectURL(objectUrl);}
}
